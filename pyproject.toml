[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "makima-lab"
version = "0.1.0"
description = "Laboratorio scientifico e sperimentale per il sistema di previsione probabilistica Makima"
readme = "python/makima_lab/README.md"
requires-python = ">=3.11"
authors = [
    { name = "Biagio Scaglia" }
]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
research = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests", "python/makima_lab"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["python"]

[tool.pyright]
include = ["python", "tests"]
extraPaths = ["python"]
executionEnvironments = [
  { root = "python" }
]
